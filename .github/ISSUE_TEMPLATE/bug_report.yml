name: Relatar um bug
description: Algo no escritório, no coletor, no executor, nos hooks ou na landing não funciona como deveria. (Report a bug.)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. Issues em inglês também são bem-vindas (English is fine).

        **Falha de segurança não vai aqui.** Use o relato privado: aba Security, "Report a vulnerability". Veja o [SECURITY.md](https://github.com/lucascodev/orquestra-office/blob/main/SECURITY.md).

        **Não cole segredo nem conteúdo privado.** Esta issue é pública. Nada de token, chave, senha, o bloco `env` do `settings.json`, o conteúdo de um `settings.json`, `config.toml` ou backup real, caminhos com o seu nome de usuário, nem texto real das suas sessões. Troque por valores fictícios antes de colar.

  - type: textarea
    id: summary
    attributes:
      label: O que aconteceu
      description: Uma ou duas frases sobre o problema.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Do começo, com os comandos que você rodou.
      placeholder: |
        1. docker compose up -d --build
        2. node hooks/install-claude-hooks.mjs
        3. Abrir uma sessão do Claude Code e pedir para editar um arquivo
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que você esperava
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: O que aconteceu de fato
      description: Mensagem de erro, comportamento na tela, o que o terminal mostrou.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Parte afetada
      multiple: true
      options:
        - Página do escritório (web)
        - Coletor (porta 8420)
        - Executor (127.0.0.1:8421)
        - Hooks e instalador do Claude Code
        - Notify e instalador do Codex
        - Landing ou demo no GitHub Pages
        - Não sei
    validations:
      required: true

  - type: dropdown
    id: run-mode
    attributes:
      label: Como o coletor roda
      options:
        - Docker (docker compose)
        - npx
        - Node direto, sem Docker (npm start em collector/)
        - Não se aplica (só a landing ou a demo)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Versão do Node
      description: Saída de `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - macOS
        - Linux
        - Outro
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Versão do sistema
      placeholder: Windows 11 24H2, macOS 15.4, Ubuntu 24.04
    validations:
      required: false

  - type: input
    id: agent-version
    attributes:
      label: Versão do Claude Code ou do Codex
      description: Saída de `claude --version` ou `codex --version`, se o problema envolve uma sessão.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Navegador
      description: Se o problema é na página.
      placeholder: Chrome 142, Firefox 145, Safari 18
    validations:
      required: false

  - type: input
    id: commit
    attributes:
      label: Commit testado
      description: Saída de `git rev-parse --short HEAD` na pasta do projeto.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Saída de `docker compose logs office`, do terminal ou do console do navegador. Revise antes de colar.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Antes de enviar
      options:
        - label: Conferi que não colei token, senha, chave, conteúdo do `settings.json` ou do `config.toml`, caminho com o meu nome de usuário nem texto privado de sessões.
          required: true
