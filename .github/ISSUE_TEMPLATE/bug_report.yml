name: Report a bug
description: Something in the office, the collector, the runner, the hooks or the landing page does not work as it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. You can write in English or Portuguese (pode escrever em português).

        **Security issues do not go here.** Use a private report: Security tab, "Report a vulnerability". See [SECURITY.md](https://github.com/lucascodev/orquestra-office/blob/main/SECURITY.md).

        **Do not paste secrets or private content.** This issue is public. No tokens, keys, passwords, the `env` block of `settings.json`, the content of a real `settings.json`, `config.toml` or backup, paths with your user name, or real text from your sessions. Replace them with fictional values before pasting.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences about the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From the start, with the commands you ran.
      placeholder: |
        1. docker compose up -d --build
        2. node hooks/install-claude-hooks.mjs
        3. Open a Claude Code session and ask it to edit a file
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Error message, what the screen showed, what the terminal printed.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected part
      multiple: true
      options:
        - Office page (web)
        - Collector (port 8420)
        - Runner (127.0.0.1:8421)
        - Claude Code hooks and installer
        - Codex notify hook and installer
        - Landing page or demo on GitHub Pages
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: run-mode
    attributes:
      label: How the collector runs
      options:
        - Docker (docker compose)
        - npx
        - Node directly, without Docker (npm start in collector/)
        - Not applicable (landing page or demo only)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: Windows 11 24H2, macOS 15.4, Ubuntu 24.04
    validations:
      required: false

  - type: input
    id: agent-version
    attributes:
      label: Claude Code or Codex version
      description: Output of `claude --version` or `codex --version`, if the problem involves a session.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser
      description: If the problem is on the page.
      placeholder: Chrome 142, Firefox 145, Safari 18
    validations:
      required: false

  - type: input
    id: commit
    attributes:
      label: Tested commit
      description: Output of `git rev-parse --short HEAD` in the project folder.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs office`, the terminal or the browser console. Review it before pasting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked that I did not paste a token, password, key, `settings.json` or `config.toml` content, a path with my user name or private session text.
          required: true
