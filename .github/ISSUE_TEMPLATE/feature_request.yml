name: Suggest a feature
description: A new idea or an improvement to something that already exists.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. You can write in English or Portuguese (pode escrever em português).

        Before opening, search open and closed issues to see whether the idea has come up already. This issue is public: do not paste secrets, real configuration or text from your sessions.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What you try to do today and where the office gets in the way or does not help.
      placeholder: When three sessions ask for permission at the same time, I cannot tell which one came first.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would behave, from the user's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Part involved
      multiple: true
      options:
        - Office page (web)
        - Collector (port 8420)
        - Runner (127.0.0.1:8421)
        - Claude Code hooks
        - Codex notify hook
        - Landing page
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: See [CONTRIBUTING.md](https://github.com/lucascodev/orquestra-office/blob/main/CONTRIBUTING.md).
      options:
        - label: I understand that the project uses no npm dependencies and that the page has no build step.
          required: true
        - label: I can open a pull request with this change.
          required: false
