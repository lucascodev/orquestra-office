name: orquestra-office

services:
  office:
    build: ./collector
    image: orquestra-office:local
    container_name: orquestra-office
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - ./web:/app/web:ro
      - office-data:/data
    secrets:
      - office_secret
    restart: unless-stopped

# The secret is created by node hooks/install-claude-hooks.mjs; run the installer before the first docker compose up.
secrets:
  office_secret:
    file: ${OFFICE_SECRET_FILE:-${USERPROFILE:-${HOME}}/.orquestra-office/secret}

volumes:
  office-data: {}
